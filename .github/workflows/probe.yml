name: 'StarScore probe (macOS WebKit)'
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - name: Build and run
      timeout-minutes: 40
      run: |
        mkdir -p out
        brew install qt >/dev/null 2>&1 || brew install qt
        cmake -S org -B orgbuild -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" > out/cmake.txt 2>&1
        cmake --build orgbuild -j4 > out/build.txt 2>&1 || (tail -60 out/build.txt > out/report.txt; exit 0)
        python3 org/fixture.py "$PWD/fx"
        if [ -d orgbuild/orgmac.app ]; then
          perl -e 'alarm shift; exec @ARGV' 600 orgbuild/orgmac.app/Contents/MacOS/orgmac "$PWD/fx" > out/report.txt 2>&1 || echo "exited $?" >> out/report.txt
          find fx -name "*.pdf" -newer org/fixture.py | head -100 >> out/report.txt
          mkdir -p out/pdfs; find fx -name "*.pdf" -newer org/fixture.py -exec cp {} out/pdfs/ \;
          cp "fx/Sheets and Demos/6 Inbox/.organizer/maintlog.json" out/ || true
        fi
    - name: Publish results to the ci-probe branch
      if: always()
      run: |
        mkdir -p /tmp/res && cp out/report.txt /tmp/res/ && ls -la out >> /tmp/res/report.txt && cp -R out/pdfs /tmp/res/ 2>/dev/null; cp out/*.json out/build.txt /tmp/res/ 2>/dev/null || true
        cd /tmp/res
        git init -q
        git config user.name "StarScore CI"
        git config user.email "ci@users.noreply.github.com"
        git add -A
        git commit -q -m "probe run ${{ github.run_number }}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-probe
