name: 'StarScore probe (macOS WebKit)'
on:
  push:
    branches: [ probe ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - name: Build and run
      timeout-minutes: 25
      run: |
        mkdir -p Probe.app/Contents/MacOS out
        cat > Probe.app/Contents/Info.plist <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
        <key>CFBundleIdentifier</key><string>org.starscore.probe</string>
        <key>CFBundleExecutable</key><string>probe</string>
        <key>CFBundleName</key><string>Probe</string>
        <key>CFBundlePackageType</key><string>APPL</string>
        <key>LSUIElement</key><true/>
        <key>NSPrincipalClass</key><string>NSApplication</string>
        </dict></plist>
        PLIST
        clang++ -fobjc-arc -O1 probe.mm -o Probe.app/Contents/MacOS/probe -framework Cocoa -framework WebKit -framework PDFKit
        codesign -s - --force --deep Probe.app || true
        perl -e 'alarm shift; exec @ARGV' 900 Probe.app/Contents/MacOS/probe "$PWD" "$PWD/out" || echo "probe exited $?" >> out/report.txt
    - name: Publish results to the ci-probe branch
      if: always()
      run: |
        mkdir -p /tmp/res && cp out/report.txt /tmp/res/ && ls -la out >> /tmp/res/report.txt && find out -name '*.pdf' -size -15M -exec cp {} /tmp/res/ \; || true
        cd /tmp/res
        git init -q
        git config user.name "StarScore CI"
        git config user.email "ci@users.noreply.github.com"
        git add -A
        git commit -q -m "probe run ${{ github.run_number }}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-probe
