name: 'StarScore Studio: macOS build'

# Every push to the starscore branch compiles StarScore Studio (Apple Silicon) to catch errors.
# A .dmg is packaged and published only when the workflow is run by hand, or the commit message contains [dmg].

on:
  push:
    branches: [ starscore ]
  workflow_dispatch:

concurrency:
  group: starscore-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

permissions:
  contents: write

jobs:
  macos_arm64:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
    - name: Clone repository
      uses: actions/checkout@v6

    - name: Configure workflow
      run: |
        bash ./buildscripts/ci/tools/make_build_mode_env.sh -e workflow_dispatch -m stable
        bash ./buildscripts/ci/tools/make_build_number.sh
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)
        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV
        echo "STARSCORE_ARCHS=arm64" | tee -a $GITHUB_ENV
        echo "NINJA_EXTRA_ARGS=-k 0" | tee -a $GITHUB_ENV

    - name: Restore ccache files
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.ccache
        key: starscore-${{runner.os}}-${{runner.arch}}-ccache-
        restore-keys: starscore-${{runner.os}}-${{runner.arch}}-ccache-

    - name: Setup ccache
      run: |
        brew install ccache
        bash ./buildscripts/ci/tools/setup_ccache_config.sh

    - name: Install Qt
      run: |
        bash ./buildscripts/ci/macos/install_qt.sh

    - name: Download dependencies
      run: |
        bash ./buildscripts/ci/macos/download_dependencies.sh

    - name: Generate _en.ts files
      env:
        LUPDATE_ARGS: ""
        POSTPROCESS_ARGS: "--warn-only"
      run: |
        bash ./tools/translations/run_lupdate.sh

    - name: Build
      run: |
        set -o pipefail
        bash ./buildscripts/ci/macos/build.sh -n ${{ env.BUILD_NUMBER }} --crash_log_url "''" 2>&1 | tee build.log

    - name: Publish build errors to the ci-logs branch
      if: failure()
      run: |
        mkdir -p /tmp/ci-logs
        { echo "run ${{ github.run_number }} commit ${{ github.sha }}"; grep -n -E "error:|Error |FAILED:|undefined|cannot find|No such file" build.log | head -300; echo; echo "---- tail ----"; tail -150 build.log; } > /tmp/ci-logs/build-errors.txt || true
        cd /tmp/ci-logs
        git init -q
        git config user.name "StarScore CI"
        git config user.email "ci@users.noreply.github.com"
        git add build-errors.txt
        git commit -q -m "build errors for run ${{ github.run_number }}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs

    - name: Show ccache stats
      if: always()
      run: ccache -sv

    - name: Package
      if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dmg]')
      run: |
        bash ./buildscripts/ci/macos/package.sh --signpass "''" --signsecret "''" --user "" --password "" --team-id ""

    - name: Publish a downloadable release
      if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dmg]')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        DMG=$(ls build.artifacts/*.dmg | head -1)
        cp "$DMG" StarScore-Studio.dmg
        TAG="build-${{ github.run_number }}"
        gh release create "$TAG" StarScore-Studio.dmg --repo "${{ github.repository }}" --target "${{ github.sha }}" \
          --title "StarScore Studio build ${{ github.run_number }}" --notes "Built from ${{ github.sha }}" --prerelease

    - name: Upload artifacts on GitHub
      if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dmg]')
      uses: actions/upload-artifact@v6
      with:
        name: StarScore-Studio-mac-arm64-${{ github.run_number }}
        path: ./build.artifacts/*.dmg
        retention-days: 30

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always()
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT

    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache
